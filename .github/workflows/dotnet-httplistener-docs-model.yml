name: HttpListener documented selector model proof

on:
  push:
    branches:
      - research/dotnet-httplistener-docs-model-20260920

permissions:
  contents: read

jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-net8, os: ubuntu-24.04, dotnet: "8.0" }
          - { name: linux-net9, os: ubuntu-24.04, dotnet: "9.0" }
          - { name: linux-net10, os: ubuntu-24.04, dotnet: "10.0" }
          - { name: macos-net10, os: macos-15, dotnet: "10.0" }
          - { name: windows-net10, os: windows-2025, dotnet: "10.0" }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '${{ matrix.dotnet }}.x'

      - name: Map test names on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "127.0.0.1 public.test admin.test" | sudo tee -a /etc/hosts

      - name: Map test names on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path "$env:SystemRoot\System32\drivers\etc\hosts" -Value "`n127.0.0.1 public.test admin.test"

      - name: Pin TFM
        shell: bash
        working-directory: research/dotnet-httplistener-docs-model
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("docs-model.csproj")
          p.write_text(p.read_text().replace("<TargetFramework>net10.0</TargetFramework>","<TargetFramework>net${{ matrix.dotnet }}</TargetFramework>"))
          PY

      - name: Runtime info
        run: dotnet --info

      - name: Run documented selector model proof
        working-directory: research/dotnet-httplistener-docs-model
        run: dotnet run -c Release
