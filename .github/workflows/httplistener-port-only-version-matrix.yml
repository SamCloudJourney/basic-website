name: HttpListener port-only supported-version matrix
on:
  push:
    branches: [research/httplistener-port-only-version-matrix-20260920]
permissions:
  contents: read
jobs:
  supported-linux:
    strategy:
      fail-fast: false
      matrix:
        tfm: ['8.0','9.0','10.0']
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ matrix.tfm }}.x' }
      - name: Run port-only bypass against supported release
        working-directory: research/httplistener-port-only-version-matrix
        shell: bash
        run: |
          set -euxo pipefail
          sed -i "s#<TargetFramework>net10.0</TargetFramework>#<TargetFramework>net${{ matrix.tfm }}</TargetFramework>#" httplistener-port-only-version-matrix.csproj
          dotnet --info
          dotnet run -c Release

  rc1:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '11.0.100-rc.1.26425.128' }
      - name: Run port-only bypass against exact .NET 11 RC1
        working-directory: research/httplistener-port-only-version-matrix
        shell: bash
        run: |
          set -euxo pipefail
          sed -i "s#<TargetFramework>net10.0</TargetFramework>#<TargetFramework>net11.0</TargetFramework>#" httplistener-port-only-version-matrix.csproj
          dotnet --info
          dotnet run -c Release
