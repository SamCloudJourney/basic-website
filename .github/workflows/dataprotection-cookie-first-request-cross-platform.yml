name: DataProtection built-in first-request cross-platform

on:
  push:
    branches:
      - research/dataprotection-cookie-first-request-20260921

permissions:
  contents: read

jobs:
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate built-in key repository
        working-directory: research/dataprotection-cookie-first-request
        shell: bash
        run: |
          set -euxo pipefail
          dotnet --info
          dotnet run -c Release | tee result.log
          grep -F 'REVOCATION_FILE_COUNT=1' result.log
          grep -F 'FIRST_POST_REVOKE_COOKIE_ACCEPTED=CONFIRMED' result.log
          grep -F 'SECOND_POST_REVOKE_COOKIE_REJECTED=True' result.log
          grep -F 'BUILTIN_REPOSITORY_FIRST_REQUEST_WINDOW=PASS' result.log
