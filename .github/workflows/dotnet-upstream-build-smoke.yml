name: dotnet-upstream-build-smoke
on:
  push:
    branches:
      - actions-runner-smoke-20260925
permissions:
  contents: read

jobs:
  aspnetcore-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone ASP.NET Core release/11.0
        run: |
          git clone --depth 1 --branch release/11.0 https://github.com/dotnet/aspnetcore.git aspnetcore
          git -C aspnetcore rev-parse HEAD

      - name: Build CSRF integration test project
        working-directory: aspnetcore
        run: |
          ./eng/build.sh --ci --restore --build --build-managed \
            --no-build-native --no-build-nodejs --no-build-java --no-build-installers \
            --projects "$PWD/src/DefaultBuilder/test/Microsoft.AspNetCore.Tests/Microsoft.AspNetCore.Tests.csproj" \
            --verbosity minimal

      - name: Build Identity functional test project
        working-directory: aspnetcore
        run: |
          ./eng/build.sh --ci --restore --build --build-managed \
            --no-build-native --no-build-nodejs --no-build-java --no-build-installers \
            --projects "$PWD/src/Identity/test/Identity.FunctionalTests/Microsoft.AspNetCore.Identity.FunctionalTests.csproj" \
            --verbosity minimal

  runtime-system-net-mail:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone runtime main
        run: |
          git clone --depth 1 --branch main https://github.com/dotnet/runtime.git runtime
          git -C runtime rev-parse HEAD

      - name: Build System.Net.Mail library
        working-directory: runtime/src/libraries/System.Net.Mail
        run: ../../../dotnet.sh build -c Release

      - name: Build and run System.Net.Mail functional tests
        working-directory: runtime/src/libraries/System.Net.Mail
        run: ../../../dotnet.sh build /t:test ./tests/Functional/System.Net.Mail.Functional.Tests.csproj -c Release
