name: HttpListener framing differential sweep

on:
  push:
    branches:
      - research/dotnet-runtime-framing-sweep-20260920

permissions:
  contents: read

jobs:
  sweep:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Runtime info
        run: dotnet --info
      - name: Run framing sweep
        working-directory: research/dotnet-httplistener-framing
        run: dotnet run -c Release
