name: Kestrel absolute-form authority control

on:
  push:
    branches:
      - research/kestrel-authority-control-20260920

permissions:
  contents: read

jobs:
  kestrel-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run Kestrel authority mismatch control
        working-directory: research/kestrel-authority-control
        shell: bash
        run: |
          set -euxo pipefail
          dotnet --info
          dotnet run -c Release
