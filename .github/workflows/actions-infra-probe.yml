name: Actions Infrastructure Probe

on:
  push:
    branches:
      - actions-infra-probe-20260925
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Runner admitted
        run: |
          echo "RUNNER_OK"
          uname -a
          dotnet --info

  windows:
    runs-on: windows-latest
    steps:
      - name: Runner admitted
        shell: pwsh
        run: |
          Write-Host "RUNNER_OK"
          [System.Environment]::OSVersion.VersionString
          dotnet --info

  bundle-dotnet-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Build minimal portable .NET 10.0.401 toolchain bundle
        shell: bash
        run: |
          set -euxo pipefail
          SRC=/usr/share/dotnet
          OUT="$RUNNER_TEMP/dotnet-portable"
          mkdir -p "$OUT"/{host/fxr,shared/Microsoft.NETCore.App,sdk,packs/Microsoft.NETCore.App.Ref,packs/Microsoft.AspNetCore.App.Ref}
          cp "$SRC/dotnet" "$OUT/dotnet"
          cp -a "$SRC/host/fxr/10.0.12" "$OUT/host/fxr/"
          cp -a "$SRC/shared/Microsoft.NETCore.App/10.0.12" "$OUT/shared/Microsoft.NETCore.App/"
          cp -a "$SRC/sdk/10.0.401" "$OUT/sdk/"
          cp -a "$SRC/packs/Microsoft.AspNetCore.App.Ref/10.0.12" "$OUT/packs/Microsoft.AspNetCore.App.Ref/"
          REFPACK="$(find "$SRC/packs/Microsoft.NETCore.App.Ref" -mindepth 1 -maxdepth 1 -type d -name '10.0.*' | sort -V | tail -1)"
          cp -a "$REFPACK" "$OUT/packs/Microsoft.NETCore.App.Ref/"
          # SDK uses these apphost/host packs for ordinary console builds.
          for pack in Microsoft.NETCore.App.Host.linux-x64 NETStandard.Library.Ref; do
            if [ -d "$SRC/packs/$pack" ]; then
              mkdir -p "$OUT/packs/$pack"
              latest="$(find "$SRC/packs/$pack" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
              cp -a "$latest" "$OUT/packs/$pack/"
            fi
          done
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/dotnet-10.0.401-linux-x64.tgz" dotnet-portable

      - name: Validate extracted toolchain
        shell: bash
        run: |
          set -euxo pipefail
          TEST="$RUNNER_TEMP/dotnet-test"
          mkdir -p "$TEST"
          tar -C "$TEST" -xzf "$RUNNER_TEMP/dotnet-10.0.401-linux-x64.tgz"
          export DOTNET_ROOT="$TEST/dotnet-portable"
          export DOTNET_MULTILEVEL_LOOKUP=0
          export PATH="$DOTNET_ROOT:$PATH"
          dotnet --info
          mkdir -p "$RUNNER_TEMP/hello"
          cd "$RUNNER_TEMP/hello"
          printf '%s\n' '<Project Sdk="Microsoft.NET.Sdk">' '  <PropertyGroup>' '    <TargetFramework>net10.0</TargetFramework>' '    <OutputType>Exe</OutputType>' '  </PropertyGroup>' '</Project>' > hello.csproj
          printf '%s\n' 'System.Console.WriteLine("PORTABLE_DOTNET_OK");' > Program.cs
          dotnet build hello.csproj -c Release
          dotnet bin/Release/net10.0/hello.dll | grep PORTABLE_DOTNET_OK

      - name: Upload portable toolchain
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-10.0.401-linux-x64-portable
          path: ${{ runner.temp }}/dotnet-10.0.401-linux-x64.tgz
          retention-days: 1
          compression-level: 0


  bundle-dotnet-matrix-overlay:
    runs-on: ubuntu-latest
    steps:
      - name: Bundle older SDKs and .NET 9 runtime packs
        shell: bash
        run: |
          set -euxo pipefail
          SRC=/usr/share/dotnet
          OUT="$RUNNER_TEMP/dotnet-matrix-overlay"
          mkdir -p "$OUT"/{sdk,shared/Microsoft.NETCore.App,packs/Microsoft.NETCore.App.Ref,packs/Microsoft.AspNetCore.App.Ref,packs/Microsoft.NETCore.App.Host.linux-x64}
          cp -a "$SRC/sdk/10.0.303" "$OUT/sdk/"
          cp -a "$SRC/sdk/9.0.318" "$OUT/sdk/"
          cp -a "$SRC/shared/Microsoft.NETCore.App/9.0.20" "$OUT/shared/Microsoft.NETCore.App/"
          cp -a "$SRC/shared/Microsoft.NETCore.App/10.0.11" "$OUT/shared/Microsoft.NETCore.App/"
          cp -a "$SRC/packs/Microsoft.NETCore.App.Ref/9.0.20" "$OUT/packs/Microsoft.NETCore.App.Ref/"
          cp -a "$SRC/packs/Microsoft.NETCore.App.Ref/10.0.11" "$OUT/packs/Microsoft.NETCore.App.Ref/"
          cp -a "$SRC/packs/Microsoft.AspNetCore.App.Ref/9.0.20" "$OUT/packs/Microsoft.AspNetCore.App.Ref/"
          cp -a "$SRC/packs/Microsoft.AspNetCore.App.Ref/10.0.11" "$OUT/packs/Microsoft.AspNetCore.App.Ref/"
          cp -a "$SRC/packs/Microsoft.NETCore.App.Host.linux-x64/9.0.20" "$OUT/packs/Microsoft.NETCore.App.Host.linux-x64/"
          cp -a "$SRC/packs/Microsoft.NETCore.App.Host.linux-x64/10.0.11" "$OUT/packs/Microsoft.NETCore.App.Host.linux-x64/"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/dotnet-sdk-matrix-overlay.tgz" dotnet-matrix-overlay

      - name: Upload SDK matrix overlay
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-sdk-matrix-overlay
          path: ${{ runner.temp }}/dotnet-sdk-matrix-overlay.tgz
          retention-days: 1
          compression-level: 0

  pack-dotnet11-rc1:
    runs-on: ubuntu-latest
    steps:
      - name: Install .NET 11 RC1
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.100-rc.1.26425.128'

      - name: Pack portable SDK
        shell: bash
        run: |
          set -euxo pipefail
          DOTNET_BIN="$(command -v dotnet)"
          DOTNET_REAL="$(readlink -f "$DOTNET_BIN")"
          DOTNET_ROOT_DIR="$(dirname "$DOTNET_REAL")"
          "$DOTNET_REAL" --info
          tar -C "$DOTNET_ROOT_DIR" -czf dotnet11-rc1-linux-x64.tar.gz .

      - name: Upload portable SDK
        uses: actions/upload-artifact@v4
        with:
          name: dotnet11-rc1-linux-x64
          path: dotnet11-rc1-linux-x64.tar.gz
          retention-days: 1
          compression-level: 0


  bundle-dotnet11-rc1-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Install exact .NET 11 RC1 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.100-rc.1.26425.128'

      - name: Build standalone .NET 11 RC1 bundle
        shell: bash
        run: |
          set -euxo pipefail
          DOTNET_BIN="$(readlink -f "$(command -v dotnet)")"
          SRC="$(dirname "$DOTNET_BIN")"
          dotnet --info
          echo "DOTNET_SRC=$SRC"
          OUT="$RUNNER_TEMP/dotnet11-rc1"
          mkdir -p "$OUT"
          cp -a "$SRC/dotnet" "$OUT/"
          cp -a "$SRC/host" "$OUT/"
          cp -a "$SRC/sdk/11.0.100-rc.1.26425.128" "$OUT/sdk/"
          mkdir -p "$OUT/shared" "$OUT/packs"
          cp -a "$SRC/shared/Microsoft.NETCore.App" "$OUT/shared/"
          cp -a "$SRC/shared/Microsoft.AspNetCore.App" "$OUT/shared/"
          for pack in Microsoft.NETCore.App.Ref Microsoft.AspNetCore.App.Ref Microsoft.NETCore.App.Host.linux-x64 NETStandard.Library.Ref; do
            if [ -d "$SRC/packs/$pack" ]; then
              cp -a "$SRC/packs/$pack" "$OUT/packs/"
            fi
          done
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/dotnet-11-rc1-linux-x64.tgz" dotnet11-rc1

      - name: Validate standalone RC1 Web SDK
        shell: bash
        run: |
          set -euxo pipefail
          TEST="$RUNNER_TEMP/dotnet11-test"
          mkdir -p "$TEST"
          tar -C "$TEST" -xzf "$RUNNER_TEMP/dotnet-11-rc1-linux-x64.tgz"
          export DOTNET_ROOT="$TEST/dotnet11-rc1"
          export DOTNET_MULTILEVEL_LOOKUP=0
          export PATH="$DOTNET_ROOT:$PATH"
          dotnet --info
          mkdir -p "$RUNNER_TEMP/webcheck"
          cd "$RUNNER_TEMP/webcheck"
          printf '%s\n' '<Project Sdk="Microsoft.NET.Sdk.Web">' '  <PropertyGroup>' '    <TargetFramework>net11.0</TargetFramework>' '  </PropertyGroup>' '</Project>' > webcheck.csproj
          printf '%s\n' 'var b = WebApplication.CreateBuilder(args);' 'var app = b.Build();' 'app.MapGet("/", () => "RC1_WEB_OK");' 'app.Run();' > Program.cs
          dotnet build webcheck.csproj -c Release

      - name: Upload .NET 11 RC1 toolchain
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-11.0.100-rc1-linux-x64
          path: ${{ runner.temp }}/dotnet-11-rc1-linux-x64.tgz
          retention-days: 1
          compression-level: 0

  generic-security-controls:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Create generic control project
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force control | Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <OutputType>Exe</OutputType>
              <ImplicitUsings>enable</ImplicitUsings>
            </PropertyGroup>
          </Project>
          '@ | Set-Content control/control.csproj

          @'
          using System.Security.Claims;
          using System.Diagnostics;

          Console.WriteLine($"OS={Environment.OSVersion}");
          Console.WriteLine($"DOTNET={Environment.Version}");

          if (OperatingSystem.IsWindows())
          {
              const string root = @"C:\ProgramData\dotnet\workloads";
              const string component = "C:";
              const string leaf = "BountyProof";
              Console.WriteLine($"ROOTED_C_COLON={Path.IsPathRooted(component)}");
              Console.WriteLine($"COMBINE={Path.Combine(root, component, leaf)}");
              Console.WriteLine($"FULL={Path.GetFullPath(Path.Combine(root, component, leaf))}");
              Console.WriteLine($"DOT_VERSION_FULL={Path.GetFullPath(Path.Combine(root, component, "."))}");
          }

          var mixed = new ClaimsPrincipal(new[]
          {
              new ClaimsIdentity(),
              new ClaimsIdentity(new[]
              {
                  new Claim(ClaimTypes.NameIdentifier, "control-user"),
                  new Claim(ClaimTypes.Role, "Admin"),
              }, "SecondaryAuth")
          });
          Console.WriteLine($"PRIMARY_AUTH={mixed.Identity?.IsAuthenticated}");
          Console.WriteLine($"ANY_AUTH={mixed.Identities.Any(i => i.IsAuthenticated)}");
          Console.WriteLine($"IS_ADMIN={mixed.IsInRole("Admin")}");

          var temp = Path.Combine(Path.GetTempPath(), "case-control-" + Guid.NewGuid().ToString("N"));
          Directory.CreateDirectory(temp);
          try
          {
              var upper = Path.Combine(temp, "A.dll");
              var lower = Path.Combine(temp, "a.dll");
              File.WriteAllText(upper, "upper");
              File.WriteAllText(lower, "lower");
              var distinct = Directory.EnumerateFiles(temp).Count() == 2;
              var stamp = DateTime.UtcNow.AddMinutes(-5);
              File.SetLastWriteTimeUtc(upper, stamp);
              File.SetLastWriteTimeUtc(lower, stamp);
              Console.WriteLine($"CASE_DISTINCT={distinct}");
              Console.WriteLine($"ORDINAL_EQUAL={string.Equals(upper, lower, StringComparison.Ordinal)}");
              Console.WriteLine($"ORDINAL_IGNORECASE_EQUAL={string.Equals(upper, lower, StringComparison.OrdinalIgnoreCase)}");
              Console.WriteLine($"MTIME_EQUAL={File.GetLastWriteTimeUtc(upper) == File.GetLastWriteTimeUtc(lower)}");
          }
          finally
          {
              Directory.Delete(temp, recursive: true);
          }
          '@ | Set-Content control/Program.cs

      - name: Run generic controls
        shell: pwsh
        run: dotnet run --project control/control.csproj -c Release

  conditional-attribute-control:
    runs-on: ubuntu-latest
    steps:
      - name: Build control library and consumer
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/conditional-control/lib /tmp/conditional-control/app

          cat >/tmp/conditional-control/lib/lib.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <AssemblyName>ControlLib</AssemblyName>
            </PropertyGroup>
          </Project>
          EOF

          cat >/tmp/conditional-control/lib/Guard.cs <<'EOF'
          using System.Diagnostics;
          public static class Guard {
            [Conditional("NEVER")]
            public static void Enforce() => throw new System.Exception("SHOULD_BE_OMITTED");
          }
          EOF

          cat >/tmp/conditional-control/app/app.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <OutputType>Exe</OutputType>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="../lib/lib.csproj" />
            </ItemGroup>
          </Project>
          EOF

          cat >/tmp/conditional-control/app/Program.cs <<'EOF'
          Guard.Enforce();
          System.Console.WriteLine("AFTER_GUARD");
          EOF

          dotnet run --project /tmp/conditional-control/app/app.csproj -c Release | tee /tmp/conditional-control/result.txt
          grep -q AFTER_GUARD /tmp/conditional-control/result.txt
