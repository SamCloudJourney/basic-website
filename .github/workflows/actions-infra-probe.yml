name: Actions Infrastructure Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Runner admitted
        run: |
          echo "RUNNER_OK"
          dotnet --info

  windows:
    runs-on: windows-latest
    steps:
      - name: Runner admitted
        shell: pwsh
        run: |
          Write-Host "RUNNER_OK"
          dotnet --info
