name: Actions Infrastructure Probe

on:
  push:
    branches:
      - actions-infra-probe-20260925
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Runner admitted
        run: |
          echo "RUNNER_OK"
          uname -a
          dotnet --info

  windows:
    runs-on: windows-latest
    steps:
      - name: Runner admitted
        shell: pwsh
        run: |
          Write-Host "RUNNER_OK"
          [System.Environment]::OSVersion.VersionString
          dotnet --info

  bundle-dotnet-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Build minimal portable .NET 10.0.401 toolchain bundle
        shell: bash
        run: |
          set -euxo pipefail
          SRC=/usr/share/dotnet
          OUT="$RUNNER_TEMP/dotnet-portable"
          mkdir -p "$OUT"/{host/fxr,shared/Microsoft.NETCore.App,sdk,packs/Microsoft.NETCore.App.Ref,packs/Microsoft.AspNetCore.App.Ref}
          cp "$SRC/dotnet" "$OUT/dotnet"
          cp -a "$SRC/host/fxr/10.0.12" "$OUT/host/fxr/"
          cp -a "$SRC/shared/Microsoft.NETCore.App/10.0.12" "$OUT/shared/Microsoft.NETCore.App/"
          cp -a "$SRC/sdk/10.0.401" "$OUT/sdk/"
          cp -a "$SRC/packs/Microsoft.AspNetCore.App.Ref/10.0.12" "$OUT/packs/Microsoft.AspNetCore.App.Ref/"
          REFPACK="$(find "$SRC/packs/Microsoft.NETCore.App.Ref" -mindepth 1 -maxdepth 1 -type d -name '10.0.*' | sort -V | tail -1)"
          cp -a "$REFPACK" "$OUT/packs/Microsoft.NETCore.App.Ref/"
          # SDK uses these apphost/host packs for ordinary console builds.
          for pack in Microsoft.NETCore.App.Host.linux-x64 NETStandard.Library.Ref; do
            if [ -d "$SRC/packs/$pack" ]; then
              mkdir -p "$OUT/packs/$pack"
              latest="$(find "$SRC/packs/$pack" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
              cp -a "$latest" "$OUT/packs/$pack/"
            fi
          done
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/dotnet-10.0.401-linux-x64.tgz" dotnet-portable

      - name: Validate extracted toolchain
        shell: bash
        run: |
          set -euxo pipefail
          TEST="$RUNNER_TEMP/dotnet-test"
          mkdir -p "$TEST"
          tar -C "$TEST" -xzf "$RUNNER_TEMP/dotnet-10.0.401-linux-x64.tgz"
          export DOTNET_ROOT="$TEST/dotnet-portable"
          export DOTNET_MULTILEVEL_LOOKUP=0
          export PATH="$DOTNET_ROOT:$PATH"
          dotnet --info
          mkdir -p "$RUNNER_TEMP/hello"
          cd "$RUNNER_TEMP/hello"
          printf '%s\n' '<Project Sdk="Microsoft.NET.Sdk">' '  <PropertyGroup>' '    <TargetFramework>net10.0</TargetFramework>' '    <OutputType>Exe</OutputType>' '  </PropertyGroup>' '</Project>' > hello.csproj
          printf '%s\n' 'System.Console.WriteLine("PORTABLE_DOTNET_OK");' > Program.cs
          dotnet build hello.csproj -c Release
          dotnet bin/Release/net10.0/hello.dll | grep PORTABLE_DOTNET_OK

      - name: Upload portable toolchain
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-10.0.401-linux-x64-portable
          path: ${{ runner.temp }}/dotnet-10.0.401-linux-x64.tgz
          retention-days: 1
          compression-level: 0


  bundle-dotnet-matrix-overlay:
    runs-on: ubuntu-latest
    steps:
      - name: Bundle older SDKs and .NET 9 runtime packs
        shell: bash
        run: |
          set -euxo pipefail
          SRC=/usr/share/dotnet
          OUT="$RUNNER_TEMP/dotnet-matrix-overlay"
          mkdir -p "$OUT"/{sdk,shared/Microsoft.NETCore.App,packs/Microsoft.NETCore.App.Ref,packs/Microsoft.AspNetCore.App.Ref,packs/Microsoft.NETCore.App.Host.linux-x64}
          cp -a "$SRC/sdk/10.0.303" "$OUT/sdk/"
          cp -a "$SRC/sdk/9.0.318" "$OUT/sdk/"
          cp -a "$SRC/shared/Microsoft.NETCore.App/9.0.20" "$OUT/shared/Microsoft.NETCore.App/"
          cp -a "$SRC/shared/Microsoft.NETCore.App/10.0.11" "$OUT/shared/Microsoft.NETCore.App/"
          cp -a "$SRC/packs/Microsoft.NETCore.App.Ref/9.0.20" "$OUT/packs/Microsoft.NETCore.App.Ref/"
          cp -a "$SRC/packs/Microsoft.NETCore.App.Ref/10.0.11" "$OUT/packs/Microsoft.NETCore.App.Ref/"
          cp -a "$SRC/packs/Microsoft.AspNetCore.App.Ref/9.0.20" "$OUT/packs/Microsoft.AspNetCore.App.Ref/"
          cp -a "$SRC/packs/Microsoft.AspNetCore.App.Ref/10.0.11" "$OUT/packs/Microsoft.AspNetCore.App.Ref/"
          cp -a "$SRC/packs/Microsoft.NETCore.App.Host.linux-x64/9.0.20" "$OUT/packs/Microsoft.NETCore.App.Host.linux-x64/"
          cp -a "$SRC/packs/Microsoft.NETCore.App.Host.linux-x64/10.0.11" "$OUT/packs/Microsoft.NETCore.App.Host.linux-x64/"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/dotnet-sdk-matrix-overlay.tgz" dotnet-matrix-overlay

      - name: Upload SDK matrix overlay
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-sdk-matrix-overlay
          path: ${{ runner.temp }}/dotnet-sdk-matrix-overlay.tgz
          retention-days: 1
          compression-level: 0

  pack-dotnet11-rc1:
    runs-on: ubuntu-latest
    steps:
      - name: Install .NET 11 RC1
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.100-rc.1.26425.128'

      - name: Pack portable SDK
        shell: bash
        run: |
          set -euxo pipefail
          DOTNET_BIN="$(command -v dotnet)"
          DOTNET_REAL="$(readlink -f "$DOTNET_BIN")"
          DOTNET_ROOT_DIR="$(dirname "$DOTNET_REAL")"
          "$DOTNET_REAL" --info
          tar -C "$DOTNET_ROOT_DIR" -czf dotnet11-rc1-linux-x64.tar.gz .

      - name: Upload portable SDK
        uses: actions/upload-artifact@v4
        with:
          name: dotnet11-rc1-linux-x64
          path: dotnet11-rc1-linux-x64.tar.gz
          retention-days: 1
          compression-level: 0
