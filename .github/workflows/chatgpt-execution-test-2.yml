name: ChatGPT execution test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute test
        run: node chatgpt-execution-test.js
