name: Kestrel port-only authority control
on:
  push:
    branches: [research/kestrel-port-only-control-20260920]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.x'}
      - working-directory: research/kestrel-port-only-control
        run: dotnet run -c Release
