name: HttpListener cross-port Negotiate auth bypass

on:
  push:
    branches:
      - research/dotnet-httplistener-cross-port-negotiate-20260920

permissions:
  contents: read

jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-net8, os: windows-2025, sdk: "8.0.x", tfm: "8.0" }
          - { name: windows-net9, os: windows-2025, sdk: "9.0.x", tfm: "9.0" }
          - { name: windows-net10, os: windows-2025, sdk: "10.0.x", tfm: "10.0" }
          - { name: windows-net11-rc1, os: windows-2025, sdk: "11.0.100-rc.1.26425.128", tfm: "11.0" }

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '${{ matrix.sdk }}'

      - name: Map synthetic hostname
        shell: pwsh
        run: Add-Content -Path "$env:SystemRoot\System32\drivers\etc\hosts" -Value "`n127.0.0.1 app.test"

      - name: Pin TFM
        shell: pwsh
        working-directory: research/dotnet-httplistener-cross-port-negotiate
        run: |
          $p = "cross-port-negotiate.csproj"
          (Get-Content $p -Raw).Replace("<TargetFramework>net10.0</TargetFramework>", "<TargetFramework>net${{ matrix.tfm }}</TargetFramework>") | Set-Content $p

      - name: Runtime info
        run: dotnet --info

      - name: Run cross-port Negotiate proof
        working-directory: research/dotnet-httplistener-cross-port-negotiate
        run: dotnet run -c Release
