name: HttpListener localhost-only cross-port auth bypass

on:
  push:
    branches:
      - research/dotnet-httplistener-localhost-cross-port-20260920

permissions:
  contents: read

jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-net10, os: ubuntu-24.04, sdk: "10.0.x", tfm: "10.0" }
          - { name: macos-net10, os: macos-15, sdk: "10.0.x", tfm: "10.0" }
          - { name: windows-net10, os: windows-2025, sdk: "10.0.x", tfm: "10.0" }
          - { name: windows-net11-rc1, os: windows-2025, sdk: "11.0.100-rc.1.26425.128", tfm: "11.0" }

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '${{ matrix.sdk }}'

      - name: Pin TFM
        shell: bash
        working-directory: research/dotnet-httplistener-one-listener-cross-port
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("one-listener-cross-port.csproj")
          p.write_text(p.read_text().replace("<TargetFramework>net10.0</TargetFramework>","<TargetFramework>net${{ matrix.tfm }}</TargetFramework>"))
          PY

      - name: Runtime info
        run: dotnet --info

      - name: Run one-listener cross-port proof
        working-directory: research/dotnet-httplistener-one-listener-cross-port
        run: dotnet run -c Release
