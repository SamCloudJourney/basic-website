name: ChatGPT Execution Test

on:
  push:
    paths:
      - 'chatgpt-execution-test.js'
      - '.github/workflows/chatgpt-execution-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute test program
        run: node chatgpt-execution-test.js
