name: dotnet HttpListener advanced parser validation

on:
  push:
    branches:
      - research/dotnet-runtime-httplistener-20260920

permissions:
  contents: read

jobs:
  differential:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Runtime info
        run: dotnet --info
      - name: Run raw parser differential harness
        working-directory: research/dotnet-httplistener
        run: dotnet run -c Release

  supported-linux:
    strategy:
      fail-fast: false
      matrix:
        tfm: ["8.0", "9.0", "10.0"]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '${{ matrix.tfm }}.x'
      - name: Run against latest supported patch
        working-directory: research/dotnet-httplistener
        shell: bash
        run: |
          set -euxo pipefail
          dotnet --info
          sed -i "s#<TargetFramework>net10.0</TargetFramework>#<TargetFramework>net${{ matrix.tfm }}</TargetFramework>#" dotnet-httplistener.csproj
          cat dotnet-httplistener.csproj
          rm -rf obj bin
          dotnet restore
          dotnet run -c Release --no-restore

  current-main-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Checkout latest dotnet runtime main
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/dotnet/runtime.git runtime-src
          cd runtime-src
          git checkout --detach origin/main
          echo "RUNTIME_SOURCE_HEAD=$(git rev-parse HEAD)"
          echo "RUNTIME_SOURCE_COMMIT_DATE=$(git show -s --format=%cI HEAD)"

      - name: Print current-main framework authority and authentication chain
        working-directory: runtime-src
        shell: bash
        run: |
          set -euxo pipefail
          echo '=== UserHostName reads received Host ==='
          grep -n -C 2 -F 'public string UserHostName => Headers[HttpKnownHeaderNames.Host]!' src/libraries/System.Net.HttpListener/src/System/Net/HttpListenerRequest.cs
          echo '=== absolute-form authority builds Request.Url ==='
          grep -n -C 3 -F 'host = raw_uri.Host;' src/libraries/System.Net.HttpListener/src/System/Net/Managed/HttpListenerRequest.Managed.cs
          echo '=== framework router selects listener from Request.Url ==='
          grep -n -C 3 -F 'HttpListener? listener = SearchListener(req.Url, out prefix);' src/libraries/System.Net.HttpListener/src/System/Net/Managed/HttpEndPointListener.cs
          grep -n -C 3 -F 'string host = uri.Host;' src/libraries/System.Net.HttpListener/src/System/Net/Managed/HttpEndPointListener.cs
          echo '=== selected listener invokes selector with HttpListenerRequest ==='
          grep -n -C 2 -F 'AuthenticationSchemeSelectorDelegate(context.Request)' src/libraries/System.Net.HttpListener/src/System/Net/Managed/HttpListener.Managed.cs
          grep -n -C 3 -F 'context.AuthenticationSchemes = context._listener!.SelectAuthenticationScheme(context);' src/libraries/System.Net.HttpListener/src/System/Net/Managed/ListenerAsyncResult.Managed.cs
          echo '=== Basic failure is converted to framework 401 challenge before context delivery ==='
          grep -n -C 4 -F 'context.Response.Headers["WWW-Authenticate"]' src/libraries/System.Net.HttpListener/src/System/Net/Managed/ListenerAsyncResult.Managed.cs

      - name: Install runtime native build prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev liblttng-ust-dev

      - name: Configure exact-prefix researcher host aliases
        shell: bash
        run: |
          set -euxo pipefail
          echo '127.0.0.1 public.test admin.test' | sudo tee -a /etc/hosts
          getent hosts public.test
          getent hosts admin.test

      - name: Inject authority and authentication regressions
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("runtime-src/src/libraries/System.Net.HttpListener/tests/HttpListenerRequestTests.cs")
          snippet = Path("research/dotnet-httplistener/current_main_authority_test.txt").read_text()
          s = p.read_text()
          marker = "        private async Task<HttpListenerRequest> GetRequest("
          assert marker in s
          p.write_text(s.replace(marker, snippet + marker, 1))

          p = Path("runtime-src/src/libraries/System.Net.HttpListener/tests/HttpListenerAuthenticationTests.cs")
          snippet = Path("research/dotnet-httplistener/current_main_auth_feature_test.txt").read_text()
          s = p.read_text()
          marker = "        public async Task<HttpResponseMessage> AuthenticationFailure("
          assert marker in s
          p.write_text(s.replace(marker, snippet + marker, 1))

          p = Path("runtime-src/src/libraries/System.Net.HttpListener/tests/HttpListenerAuthenticationTests.cs")
          snippet = Path("research/dotnet-httplistener/current_main_exact_prefix_test.txt").read_text()
          s = p.read_text()
          marker = "        public async Task<HttpResponseMessage> AuthenticationFailure("
          assert marker in s
          p.write_text(s.replace(marker, snippet + marker, 1))
          PY

      - name: Build current-main CoreCLR and libraries testhost
        working-directory: runtime-src
        shell: bash
        run: |
          set -euxo pipefail
          ./build.sh -subset clr+libs -c Release -rc Release

      - name: Run current-main authority regression
        working-directory: runtime-src
        shell: bash
        run: |
          set -euxo pipefail
          ./dotnet.sh build src/libraries/System.Net.HttpListener/tests/System.Net.HttpListener.Tests.csproj -c Release /t:Test /p:XunitMethodName=System.Net.Tests.HttpListenerRequestTests.AbsoluteFormMismatchedHost_ExposesConflictingAuthority

      - name: Run current-main authentication feature bypass regression
        working-directory: runtime-src
        shell: bash
        run: |
          set -euxo pipefail
          ./dotnet.sh build src/libraries/System.Net.HttpListener/tests/System.Net.HttpListener.Tests.csproj -c Release /t:Test /p:TestNoBuild=true /p:XunitMethodName=System.Net.Tests.HttpListenerAuthenticationTests.AuthenticationSchemeSelector_AbsoluteFormMismatchedHost_FullWireBypass

      - name: Run current-main exact-prefix admin-listener bypass regression
        working-directory: runtime-src
        shell: bash
        run: |
          set -euxo pipefail
          ./dotnet.sh build src/libraries/System.Net.HttpListener/tests/System.Net.HttpListener.Tests.csproj -c Release /t:Test /p:TestNoBuild=true /p:XunitMethodName=System.Net.Tests.HttpListenerAuthenticationTests.AuthenticationSchemeSelector_AbsoluteFormMismatchedHost_ExactHostPrefixRoutesAdminListener

      - name: Apply experimental three-line absolute-form authority canonicalization
        working-directory: runtime-src
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/libraries/System.Net.HttpListener/src/System/Net/Managed/HttpListenerRequest.Managed.cs")
          s = p.read_text()
          old = "            if (raw_uri != null)\n                host = raw_uri.Host;\n"
          new = "            if (raw_uri != null)\n            {\n                host = raw_uri.Host;\n                Headers.Set(HttpKnownHeaderNames.Host, raw_uri.Authority);\n            }\n"
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          git diff -- src/libraries/System.Net.HttpListener/src/System/Net/Managed/HttpListenerRequest.Managed.cs

      - name: Rebuild patched HttpListener product assembly
        working-directory: runtime-src
        shell: bash
        run: |
          set -euxo pipefail
          ./dotnet.sh build src/libraries/System.Net.HttpListener/src/System.Net.HttpListener.csproj -c Release

      - name: Run experimental guard negative control
        working-directory: runtime-src
        shell: bash
        run: |
          set -euxo pipefail
          ./dotnet.sh build src/libraries/System.Net.HttpListener/tests/System.Net.HttpListener.Tests.csproj -c Release /t:Test /p:XunitMethodName=System.Net.Tests.HttpListenerAuthenticationTests.AuthenticationSchemeSelector_AbsoluteFormAuthorityCanonicalizationGuard_PreservesControls

      - name: Run experimental exact-prefix admin-listener guard
        working-directory: runtime-src
        shell: bash
        run: |
          set -euxo pipefail
          ./dotnet.sh build src/libraries/System.Net.HttpListener/tests/System.Net.HttpListener.Tests.csproj -c Release /t:Test /p:TestNoBuild=true /p:XunitMethodName=System.Net.Tests.HttpListenerAuthenticationTests.AuthenticationSchemeSelector_AbsoluteFormAuthorityCanonicalizationGuard_ExactHostPrefixBlocksAdminListener

  boundary-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install nginx HAProxy Apache and Varnish
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx haproxy apache2 varnish
          sudo a2enmod proxy proxy_http rewrite headers
          sudo systemctl stop apache2 || true

      - name: Start managed HttpListener backend
        shell: bash
        run: |
          set -euxo pipefail
          cd research/dotnet-httplistener
          nohup dotnet run -c Release -- --server > /tmp/backend.log 2>&1 &
          for i in {1..60}; do
            grep -q BACKEND_READY /tmp/backend.log && break
            sleep 1
          done
          cat /tmp/backend.log
          grep -q BACKEND_READY /tmp/backend.log

      - name: Configure nginx baseline and Host ACL
        shell: bash
        run: |
          mkdir -p /tmp/nginx/logs
          cat >/tmp/nginx/nginx.conf <<'EOF'
          events {}
          error_log /tmp/nginx/logs/error.log info;
          pid /tmp/nginx/nginx.pid;
          http {
            access_log /tmp/nginx/logs/access.log;
            server {
              listen 127.0.0.1:18080;
              location / {
                proxy_http_version 1.1;
                proxy_set_header Connection close;
                proxy_set_header Host $http_host;
                proxy_pass http://127.0.0.1:18081;
              }
            }
            server {
              listen 127.0.0.1:18085;
              if ($http_host != "public.test") { return 403; }
              location / {
                proxy_http_version 1.1;
                proxy_set_header Connection close;
                proxy_set_header Host $http_host;
                proxy_pass http://127.0.0.1:18081;
              }
            }
            server {
              listen 127.0.0.1:18088;
              location /public/ {
                proxy_http_version 1.1;
                proxy_set_header Connection close;
                proxy_set_header Host $http_host;
                proxy_pass http://127.0.0.1:18081;
              }
              location / { return 403; }
            }
          }
          EOF
          sudo nginx -p /tmp/nginx -c /tmp/nginx/nginx.conf

      - name: Configure HAProxy baseline Host ACL and path ACL
        shell: bash
        run: |
          cat >/tmp/haproxy.cfg <<'EOF'
          global
            log stdout format raw local0
          defaults
            mode http
            timeout connect 3s
            timeout client 5s
            timeout server 5s

          frontend baseline
            bind 127.0.0.1:18082
            default_backend be

          frontend host_acl
            bind 127.0.0.1:18084
            http-request deny deny_status 403 unless { hdr(host),lower -m str public.test }
            default_backend be

          frontend path_acl
            bind 127.0.0.1:18087
            http-request deny deny_status 403 unless { path_beg /public }
            default_backend be

          backend be
            server s1 127.0.0.1:18081
          EOF
          nohup haproxy -f /tmp/haproxy.cfg -db >/tmp/haproxy.log 2>&1 &
          sleep 1

      - name: Configure Apache baseline and Host ACL
        shell: bash
        run: |
          cat >/tmp/apache.conf <<'EOF'
          ServerRoot "/etc/apache2"
          PidFile /tmp/apache.pid
          Listen 127.0.0.1:18083
          Listen 127.0.0.1:18086
          Listen 127.0.0.1:18089
          LoadModule mpm_event_module /usr/lib/apache2/modules/mod_mpm_event.so
          LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
          LoadModule authz_host_module /usr/lib/apache2/modules/mod_authz_host.so
          LoadModule proxy_module /usr/lib/apache2/modules/mod_proxy.so
          LoadModule proxy_http_module /usr/lib/apache2/modules/mod_proxy_http.so
          LoadModule rewrite_module /usr/lib/apache2/modules/mod_rewrite.so
          ErrorLog /tmp/apache-error.log
          LogLevel info

          <VirtualHost 127.0.0.1:18083>
            ProxyPreserveHost On
            ProxyPass / http://127.0.0.1:18081/
            ProxyPassReverse / http://127.0.0.1:18081/
          </VirtualHost>

          <VirtualHost 127.0.0.1:18086>
            ProxyPreserveHost On
            RewriteEngine On
            RewriteCond %{HTTP_HOST} !^public\.test$ [NC]
            RewriteRule ^ - [F]
            ProxyPass / http://127.0.0.1:18081/
            ProxyPassReverse / http://127.0.0.1:18081/
          </VirtualHost>

          <VirtualHost 127.0.0.1:18089>
            ProxyPreserveHost On
            RewriteEngine On
            RewriteCond %{REQUEST_URI} !^/public/
            RewriteRule ^ - [F]
            ProxyPass / http://127.0.0.1:18081/
            ProxyPassReverse / http://127.0.0.1:18081/
          </VirtualHost>
          EOF
          sudo /usr/sbin/apache2 -f /tmp/apache.conf -DFOREGROUND >/tmp/apache.log 2>&1 &
          sleep 2

      - name: Configure Varnish baseline and Host ACL
        shell: bash
        run: |
          cat >/tmp/varnish-baseline.vcl <<'EOF'
          vcl 4.1;
          backend default {
            .host = "127.0.0.1";
            .port = "18081";
          }
          sub vcl_recv {
            return (pass);
          }
          EOF

          cat >/tmp/varnish-acl.vcl <<'EOF'
          vcl 4.1;
          backend default {
            .host = "127.0.0.1";
            .port = "18081";
          }
          sub vcl_recv {
            if (req.http.host != "public.test") {
              return (synth(403, "Host denied"));
            }
            return (pass);
          }
          EOF

          mkdir -p /tmp/varnish1 /tmp/varnish2
          sudo varnishd -a 127.0.0.1:18090 -f /tmp/varnish-baseline.vcl -s malloc,64m -n /tmp/varnish1
          sudo varnishd -a 127.0.0.1:18091 -f /tmp/varnish-acl.vcl -s malloc,64m -n /tmp/varnish2
          sleep 2

      - name: Execute authority and path boundary matrix
        shell: bash
        run: |
          set -euxo pipefail
          python3 research/dotnet-httplistener/proxy_probe.py | tee /tmp/probe.log
          echo '--- malformed chunk extension proxy matrix ---'
          python3 research/dotnet-httplistener/chunk_proxy_probe.py | tee /tmp/chunk-proxy.log
          echo '--- backend contexts ---'
          cat /tmp/backend.log
          echo '--- nginx logs ---'
          cat /tmp/nginx/logs/access.log || true
          cat /tmp/nginx/logs/error.log || true
          echo '--- haproxy logs ---'
          cat /tmp/haproxy.log || true
          echo '--- apache logs ---'
          cat /tmp/apache.log || true
          cat /tmp/apache-error.log || true
          echo '--- varnish process state ---'
          ps aux | grep '[v]arnish' || true
