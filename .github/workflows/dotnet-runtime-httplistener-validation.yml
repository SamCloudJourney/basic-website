name: dotnet HttpListener parser differential validation

on:
  push:
    branches:
      - research/dotnet-runtime-httplistener-20260920

permissions:
  contents: read

jobs:
  differential:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Runtime info
        run: dotnet --info
      - name: Run raw parser differential harness
        working-directory: research/dotnet-httplistener
        run: dotnet run -c Release
