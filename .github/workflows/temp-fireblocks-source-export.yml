name: Temporary Fireblocks source export

on:
  push:
    paths:
      - ".github/workflows/temp-fireblocks-source-export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Clone exact public Fireblocks source
        run: |
          git clone https://github.com/fireblocks/mpc-lib.git mpc-lib
          cd mpc-lib
          git checkout 00ae08b7f1bdbb887aedece384aca2f942aae432
          test "$(git rev-parse HEAD)" = "00ae08b7f1bdbb887aedece384aca2f942aae432"
          git rev-parse HEAD > ../audited-sha.txt
          rm -rf .git
      - name: Package public source
        run: tar -czf mpc-lib-00ae08b-source.tar.gz mpc-lib audited-sha.txt
      - name: Upload public-source artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpc-lib-00ae08b-source
          path: mpc-lib-00ae08b-source.tar.gz
          retention-days: 1
