name: HttpListener port-only auth bypass
on:
  push:
    branches: [research/httplistener-port-only-auth-bypass-20260920]
permissions:
  contents: read
jobs:
  port-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Run same-host two-port framework proof
        working-directory: research/httplistener-port-only-auth-bypass
        run: dotnet run -c Release
