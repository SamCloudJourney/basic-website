name: VS Code localhost redirect integration

on:
  push:
    branches: [ research/vscode-validation-20260920 ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Checkout current VS Code main
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/microsoft/vscode.git vscode
          cd vscode
          echo "VSCODE_HEAD=$(git rev-parse HEAD)"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libkrb5-dev libx11-dev libxkbfile-dev pkg-config libgtk-3-0 libnss3 libasound2t64
          cd vscode
          npm ci --no-audit --no-fund
          npm run transpile-client
          npm run electron
          npm run electron

      - name: Write focused integration harness
        working-directory: vscode
        run: |
          cat > /tmp/vscode-localhost-redirect.mjs <<'EOF'
          import http from 'node:http';
          import os from 'node:os';
          import assert from 'node:assert/strict';
          import { app, BrowserWindow } from 'electron';
          import { WebPageLoader } from './out/vs/platform/webContentExtractor/electron-main/webPageLoader.js';
          import { URI } from './out/vs/base/common/uri.js';
          import { isURLDomainTrusted } from './out/vs/platform/url/common/trustedDomains.js';

          const interfaces = os.networkInterfaces();
          const nonLoopback = Object.values(interfaces).flat().find(x => x && x.family === 'IPv4' && !x.internal)?.address;
          if (!nonLoopback) throw new Error('No non-loopback IPv4 address');
          const hits = { loopback: 0, control: 0 };

          function listen(server, host='0.0.0.0') {
            return new Promise(resolve => server.listen(0, host, () => resolve(server.address().port)));
          }
          function close(server) { return new Promise(resolve => server.close(resolve)); }

          const target = http.createServer((req,res) => {
            hits.loopback++;
            res.writeHead(200, {'content-type':'text/html'});
            res.end('<html><body><main>LOOPBACK_SENTINEL_8f291 '.repeat(20) + '</main></body></html>');
          });
          const controlTarget = http.createServer((req,res) => {
            hits.control++;
            res.writeHead(200, {'content-type':'text/html'});
            res.end('<html><body><main>CONTROL_SENTINEL '.repeat(20) + '</main></body></html>');
          });
          const targetPort = await listen(target, '127.0.0.1');
          const controlPort = await listen(controlTarget, '0.0.0.0');

          const source = http.createServer((req,res) => {
            const u = new URL(req.url, 'http://x');
            const dest = u.pathname === '/candidate'
              ? `http://127.0.0.1:${targetPort}/secret`
              : `http://${nonLoopback}:${controlPort}/blocked`;
            res.writeHead(302, { location: dest });
            res.end();
          });
          const sourcePort = await listen(source, '0.0.0.0');

          const logger = { trace(){}, info(){}, warn(){}, error(){}, debug(){}, flush(){} };
          const networkFilter = { isUriAllowed(){ return true; }, formatError(uri){ return 'blocked:' + uri.toString(); } };

          async function extract(path) {
            const uri = URI.parse(`http://${nonLoopback}:${sourcePort}${path}`);
            const loader = new WebPageLoader(
              options => new BrowserWindow(options),
              logger,
              uri,
              undefined,
              u => isURLDomainTrusted(u, []),
              networkFilter
            );
            try { return await loader.load(); } finally { loader.dispose(); }
          }

          const watchdog = setTimeout(() => {
            console.error('HARNESS_TIMEOUT');
            app.exit(2);
            process.exit(2);
          }, 90000);
          await app.whenReady();
          let exitCode = 0;
          try {
            console.log('SOURCE_AUTHORITY=' + nonLoopback + ':' + sourcePort);
            console.log('TARGET_AUTHORITY=127.0.0.1:' + targetPort);
            console.log('TRUST_LOOPBACK=' + isURLDomainTrusted(URI.parse(`http://127.0.0.1:${targetPort}/secret`), []));
            console.log('TRUST_CONTROL=' + isURLDomainTrusted(URI.parse(`http://${nonLoopback}:${controlPort}/blocked`), []));

            const candidate = await extract('/candidate');
            const candidateHits = hits.loopback;
            const control = await extract('/control');

            console.log('CANDIDATE_RESULT=' + JSON.stringify(candidate));
            console.log('CONTROL_RESULT=' + JSON.stringify(control));
            console.log('HITS=' + JSON.stringify(hits));

            assert.equal(isURLDomainTrusted(URI.parse(`http://127.0.0.1:${targetPort}/secret`), []), true);
            assert.equal(isURLDomainTrusted(URI.parse(`http://${nonLoopback}:${controlPort}/blocked`), []), false);
            assert.ok(candidateHits > 0, 'loopback redirect target was not contacted');
            assert.equal(candidate.status, 'ok', 'candidate redirect did not complete');
            assert.ok(candidate.result.includes('LOOPBACK_SENTINEL_8f291'), 'loopback response was not extracted');
            assert.equal(hits.control, 0, 'non-trusted redirect target should not be contacted');
            assert.equal(control.status, 'redirect', 'non-trusted cross-authority redirect should be surfaced instead of followed');
            console.log('INTEGRATION_VERDICT=PASS');
          } catch (err) {
            exitCode = 1;
            console.error('INTEGRATION_ERROR=' + (err?.stack || err));
          } finally {
            clearTimeout(watchdog);
            await Promise.all([close(source), close(target), close(control)]);
            app.exit(exitCode);
            process.exit(exitCode);
          }
          EOF

      - name: Run Electron integration test
        working-directory: vscode
        run: |
          set -euxo pipefail
          timeout 120s xvfb-run -a ./.build/electron/code-oss --no-sandbox /tmp/vscode-localhost-redirect.mjs
