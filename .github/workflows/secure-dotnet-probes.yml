name: Secure Dotnet Probe Runner

on:
  push:
    branches:
      - secure-dotnet-probes-20260925
    paths:
      - .github/secure-trigger/start.txt

permissions:
  contents: write

jobs:
  secure-probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-latest
          - target: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - name: Checkout runner repo
        uses: actions/checkout@v4
        with:
          ref: secure-dotnet-probes-20260925
          fetch-depth: 0
          persist-credentials: true

      - name: Run encrypted probe executor
        shell: pwsh
        run: ./.github/secure-runner/runner.ps1 -Target "${{ matrix.target }}"

      - name: Upload encrypted result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secure-result-${{ matrix.target }}
          path: ${{ runner.temp }}/secure-result/
          retention-days: 1
